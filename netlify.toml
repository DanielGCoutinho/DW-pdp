[build]
  functions = "netlify/functions"
  publish = "."

# Static files (e.g. pages/dwst60436.html, committed directly to the repo)
# are served as-is -- Netlify only falls through to this redirect when no
# matching file exists on disk, which is what makes pages generated later
# (stored in Supabase Storage, proxied through the function below) work
# under the same /pages/<sku>.html URL shape without a git push.
[[redirects]]
  from = "/pages/:sku.html"
  to = "/.netlify/functions/page?sku=:sku"
  status = 200
