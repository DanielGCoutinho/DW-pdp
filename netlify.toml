[build]
  publish = "."

# All generated pages now live in Supabase Storage (not committed to git --
# the routine has no write access to this repo). This edge function proxies
# /pages/<sku>.html to Storage with the correct content-type, streaming the
# body -- no 6MB response cap like the old (Lambda) function had.
[[edge_functions]]
  path = "/pages/*"
  function = "page"
